name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python check_backend.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t error-log-book .
      - name: Container refuses to start without JWT_SECRET
        run: "! docker run --rm error-log-book"
      - name: Container starts and passes its health check
        run: |
          docker run -d --name app -p 8000:8000 -e JWT_SECRET="$(openssl rand -base64 48)" error-log-book
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs app
          exit 1
