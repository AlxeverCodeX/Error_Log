# Project metadata and tool config. This is an application, not an installable
# package: install dependencies from requirements.txt / requirements-dev.txt.
[project]
name = "error-log-book"
version = "1.1.0"
description = "Error Log Book — SQLite + FastAPI + Frontend for tracking errors and fixes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "bcrypt>=4.1.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
