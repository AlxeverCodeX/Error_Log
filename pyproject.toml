[project]
name = "error-log-book"
version = "1.0.0"
description = "Error Log Book — SQLite + FastAPI + Frontend for tracking errors and fixes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "bcrypt>=4.1.0",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[project.scripts]
error-log-book = "server:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
